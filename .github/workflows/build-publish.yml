name: Build and publish kognic-openpcdet

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.6.1). Leave empty to use version from source.'
        required: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest-m
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          fi
          if [[ -n "${VERSION}" ]]; then
            # Override the version computation in setup.py (removes +git_hash local segment)
            sed -i "s/version = '0\.6\.0+%s' % get_git_commit_number()/version = '${VERSION}'/" setup.py
            echo "Publishing version: ${VERSION}"
          else
            # Strip the +local segment so Artifact Registry accepts it
            sed -i "s/version = '0\.6\.0+%s' % get_git_commit_number()/version = '0.6.0'/" setup.py
            echo "Publishing version: 0.6.0"
          fi

      - name: Build wheel in CUDA container
        run: |
          docker build -t openpcdet-builder -f .github/build.Dockerfile .

      - name: Extract wheel
        run: |
          CONTAINER_ID=$(docker create openpcdet-builder)
          docker cp "${CONTAINER_ID}":/dist ./dist
          docker rm "${CONTAINER_ID}"
          ls -lh dist/

      - name: Setup auth
        uses: annotell/gha-common/gcloud-auth@6fdf9a5904219697387a25036207a5407e648022 # v1.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Publish to Artifact Registry
        run: |
          export UV_PUBLISH_USERNAME=oauth2accesstoken
          export UV_PUBLISH_PASSWORD=$(gcloud auth print-access-token)
          export UV_PUBLISH_URL=https://us-east4-python.pkg.dev/annotell-com/python-default-us
          uv publish dist/*.whl
