DATASET: 'AutobaansDataset'
DATA_PATH: '/root/autobaans/3dod/dataset/'

POINT_CLOUD_RANGE: [ -100, -60, -2, 100, 60, 4 ]

FILTER_EMPTY_BOXES_FOR_TRAIN: True

GET_ITEM_LIST: [ "points" ]
FOV_POINTS_ONLY: False

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': ["autobaans_infos_train.pkl"],
    'test': ["autobaans_infos_val.pkl"],
}

DATA_AUGMENTOR:
  DISABLE_AUG_LIST: [ 'placeholder' ]
  AUG_CONFIG_LIST:
    - NAME: random_world_flip
      ALONG_AXIS_LIST: [ 'x' , 'y']

    - NAME: random_world_rotation
      WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

    - NAME: random_world_scaling
      WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

    - NAME: random_world_translation
      NOISE_TRANSLATE_STD: [0.5, 0.5, 0.5]
    
    - NAME: gt_sampling
      USE_ROAD_PLANE: False
      DB_INFO_PATH:
          - autobaans_dbinfos_train.pkl
      USE_SHARED_MEMORY: False  # set it to True to speed up (it costs about 15GB shared memory)
      PREPARE: {
          filter_by_min_points: ['Medium:3', 'Large:3', 'VeryLarge:3'],
      }
      SAMPLE_GROUPS: ['Medium:3', 'Large:10', 'VeryLarge:10']
      NUM_POINT_FEATURES: 4
      REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
      LIMIT_WHOLE_SCENE: False

POINT_FEATURE_ENCODING: {
  encoding_type: absolute_coordinates_encoding,
  used_feature_list: [ 'x', 'y', 'z', 'intensity' ],
  src_feature_list: [ 'x', 'y', 'z', 'intensity' ],
}

DATA_PROCESSOR:
  - NAME: mask_points_and_boxes_outside_range
    REMOVE_OUTSIDE_BOXES: True

  - NAME: shuffle_points
    SHUFFLE_ENABLED: {
      'train': True,
      'test': False
    }

  - NAME: transform_points_to_voxels
    VOXEL_SIZE: [ 0.05, 0.05, 0.15 ]
    MAX_POINTS_PER_VOXEL: 10
    MAX_NUMBER_OF_VOXELS: {
      'train': 150000,
      'test': 150000
    }
